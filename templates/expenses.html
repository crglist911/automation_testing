<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses</title>
</head>
<body>
    <h1>Expenses</h1>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>
            {% for expense in expenses %}
            <tr>
                <td>{{ expense['date'] }}</td>
                <td>{{ expense['name'] }}</td>
                <td>${{ "%.2f"|format(expense['amount']) }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
