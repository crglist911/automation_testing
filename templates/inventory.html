<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Inventory</title>
</head>
<body>
    <h1>Current Inventory</h1>
    <table>
        <thead>
            <tr>
                <th>Brand</th>
                <th>Name</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody>
            {% for item in inventory %}
            <tr>
                <td>{{ item['brand'] }}</td>
                <td>{{ item['name'] }}</td>
                <td>${{ "%.2f"|format(item['price']) }}</td>
                <td>{{ item['quantity'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
