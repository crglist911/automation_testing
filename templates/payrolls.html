<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Data</title>
</head>
<body>
    <h1>Payroll Data</h1>
    <table>
        <thead>
            <tr>
                <th>Employee Name</th>
                <th>Date</th>
                <th>Hours Worked</th>
                <th>Total Pay</th>
            </tr>
        </thead>
        <tbody>
            {% for payroll in payrolls %}
            <tr>
                <td>{{ payroll['name'] }}</td>
                <td>{{ payroll['date'] }}</td>
                <td>{{ payroll['hours_worked'] }}</td>
                <td>${{ "%.2f"|format(payroll['total_pay']) }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
